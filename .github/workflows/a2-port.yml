name: a2-port
on:
  push:
    branches: [a2-latency-port]
    paths: ['src/**','tests/**','.github/workflows/a2-port.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Existing simulator tests
        run: make test
      - name: Elastic A2 policy tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_elastic_dual_lru.cpp -o /tmp/test_elastic
          /tmp/test_elastic
      - name: A2 Map tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_a2_map.cpp -o /tmp/test_a2_map
          /tmp/test_a2_map
  real-a2-latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake pkg-config libglib2.0-dev libzstd-dev libaio-dev
          python -m pip install --quiet zstandard
      - uses: actions/checkout@v4
        with:
          repository: gilga1983/rankmap-cache
          ref: a2-latency-export
          path: rankmap
      - name: Build production RAP + Map latency A2
        working-directory: rankmap
        run: python projects/joint_cache_prefetch/build_latency_a2.py --artifact-dir _native/capsule
      - name: Materialize prn_0 and exact spread arrivals
        run: |
          python - <<'PY'
          import sys,struct
          sys.path.insert(0,'tools')
          from run_fast_lru import materialize
          materialize('msr_prn_0',300000,'/tmp/prn.oracle')
          rec=[]
          with open('/tmp/prn.oracle','rb') as f:
            while len(rec)<300000:
              b=f.read(24)
              if not b: break
              rec.append(struct.unpack('<IQIq',b))
          first=rec[0][0]; out=[]; i=0
          while i<len(rec):
            j=i+1
            while j<len(rec) and rec[j][0]==rec[i][0]: j+=1
            n=j-i;base=(rec[i][0]-first)*1000000
            out.extend(base+((k+1)*1000000)//(n+1) for k in range(n))
            i=j
          open('/tmp/arrivals.txt','w').write('\n'.join(map(str,out))+'\n')
          print('arrivals',len(out),'first',out[0],'last',out[-1])
          PY
      - name: Run actual A2 latency sweep
        working-directory: rankmap
        run: |
          BIN=_native/capsule/_build/bin/native_bench_latency_a2
          M=10485760
          : > /tmp/a2-latency.jsonl
          for L in 0 1000 5000 10000 20000; do
            echo "=== latency $L us ==="
            V8_BYTE_BUDGET=131072 JCP_ELASTIC_CACHE_QUOTA_BYTES="$M" JCP_ELASTIC_A1=1 JCP_A1_PARTS=10 JCP_A1_INTERVAL_BYTES=104857600 JCP_LATENCY_US="$L" JCP_LATENCY_ARRIVALS=/tmp/arrivals.txt \
              "$BIN" /tmp/prn.oracle "$M" 4.0 v8 > "/tmp/a2-$L.out" 2> "/tmp/a2-$L.err"
            grep 'jcp_a2_latency' "/tmp/a2-$L.out" | tail -1 | tee -a /tmp/a2-latency.jsonl
            grep 'jcp_elastic_rap' "/tmp/a2-$L.out" | tail -1
          done
      - name: Baselines matched sweep
        run: |
          make trace_bench
          python tools/run_prefetch_smoke.py --binary ./trace_bench --trace msr_prn_0 --limit 300000 --capacity 10485760 --latencies-us 0,1000,5000,10000,20000 --prefetchers none,stride,pg --out /tmp/baselines.json
      - name: Print comparison
        run: |
          python - <<'PY'
          import json
          a2=[json.loads(x) for x in open('/tmp/a2-latency.jsonl') if x.strip()]
          b=json.load(open('/tmp/baselines.json'))['results']
          d={r['prefetcher']:{x['latency_us']:x['average_access_time_us'] for x in r['scenarios']} for r in b}
          print('latency_us,none,stride,pg,a2')
          for x in a2:
            L=x['latency_us'];print(f"{L},{d['none'][L]:.6f},{d['stride'][L]:.6f},{d['pg'][L]:.6f},{x['average_access_time_us']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: actual-a2-latency-prn0
          path: |
            /tmp/a2-latency.jsonl
            /tmp/baselines.json
            /tmp/a2-*.out
            /tmp/a2-*.err
