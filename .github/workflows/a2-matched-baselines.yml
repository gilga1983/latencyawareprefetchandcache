name: a2-matched-baselines
on:
  push:
    branches: [a2-latency-port]
    paths: ['.github/workflows/a2-matched-baselines.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install zstandard
      - run: make test
      - name: Matched prn_0 latency sweep
        run: |
          mkdir -p results
          python tools/run_prefetch_smoke.py --binary ./trace_bench --trace msr_prn_0 --limit 300000 --capacity 10485760 --latencies-us 0,1000,5000,10000,20000 --prefetchers none,stride,pg --out results/a2-matched-prn0.json
      - uses: actions/upload-artifact@v4
        with:
          name: a2-matched-prn0
          path: results/a2-matched-prn0.json
