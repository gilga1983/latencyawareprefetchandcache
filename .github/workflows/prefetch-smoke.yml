name: prefetch-smoke
on:
  push:
    branches: [prefetch-baselines]
    paths:
      - 'src/**'
      - 'tools/run_prefetch_smoke.py'
      - '.github/workflows/prefetch-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        trace: [msr_hm_0, msr_prn_0, msr_proj_0, msr_web_2]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install zstandard
      - run: make test
      - name: Run latency-aware comparison
        run: python tools/run_prefetch_smoke.py --binary ./trace_bench --trace ${{ matrix.trace }} --limit 1000000 --prefetchers none,obl,stride,pg --out results/${{ matrix.trace }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prefetch-results-${{ matrix.trace }}
          path: results/${{ matrix.trace }}.json
