name: prefetch-smoke
on:
  push:
    branches: [prefetch-baselines]
    paths:
      - 'src/**'
      - 'tools/run_prefetch_smoke.py'
      - '.github/workflows/prefetch-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install zstandard
      - run: make test
      - name: Run one-trace comparison
        run: python tools/run_prefetch_smoke.py --binary ./trace_bench --trace msr_hm_0 --limit 200000 --prefetchers none,obl,stride,pg --out results/prefetch_smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prefetch-smoke-results
          path: results/prefetch_smoke.json
