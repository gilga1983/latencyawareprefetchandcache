name: fast-lru

on:
  push:
    paths:
      - 'src/**'
      - 'tools/run_fast_lru.py'
      - '.github/workflows/fast-lru.yml'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install trace dependency
        run: python -m pip install zstandard
      - name: Build benchmark
        run: make trace_bench
      - name: One-million-request screen on all FAST traces
        run: |
          mkdir -p results
          python tools/run_fast_lru.py \
            --binary ./trace_bench \
            --limit 1000000 \
            --latencies-us 0,1000,5000,10000,20000 \
            --out results/fast_lru_1m.json
      - name: Full published-trace equivalence and latency screen
        run: |
          python tools/run_fast_lru.py \
            --binary ./trace_bench \
            --limit 0 \
            --traces msr_hm_0 w90 w91 w92 w93 w94 w95 \
            --latencies-us 0,1000,5000,10000,20000 \
            --out results/fast_lru_full_selected.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-lru-results
          path: results/
